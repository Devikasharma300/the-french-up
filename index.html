<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The French Up</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#efefef;
    font-family:'Poppins',sans-serif;
}

/* NAVIGATION */
nav{
    background:#f5f5f5;
    padding:25px 10%;
    display:flex;
    justify-content:flex-end;
    gap:50px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-size:15px;
}

/* HERO */
.hero{
    display:flex;
    min-height:85vh;
}

.hero-left{
    width:65%;
    background:#f51923;
    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;

    padding-left:120px;

    border-top-right-radius:45%;
    border-bottom-right-radius:45%;
}

.hero-left .the{
    font-size:60px;
    color:#2200d8;
    font-family:cursive;
    margin-bottom:20px;
}

.hero-left h1{
    font-family:'Oswald',sans-serif;
    font-size:130px;
    line-height:0.9;
    letter-spacing:8px;
}

.hero-left p{
    margin-top:30px;
    font-size:28px;
}

.hero-right{
    width:35%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* dancer image */
.dancer-img{
    position:absolute;
    width:450px;
    max-width:90%;
    right:40px;
    top:40px;
    z-index:5;
}

/* stairs */
.stairs{
    position:absolute;
    bottom:40px;
    right:40px;
}

.step{
    width:120px;
    height:120px;
    background:#f51923;
    border-top:25px solid #2200d8;
    margin-left:auto;
}

.step:nth-child(2){
    width:180px;
}

.step:nth-child(3){
    width:240px;
}

.step:nth-child(4){
    width:300px;
}

/* LIVE SECTION */
.live{
    background:#efefef;
    padding:120px 10%;
    display:grid;
    grid-template-columns:1fr 40px 1fr;
    align-items:center;
}

.live-title{
    font-family:'Playfair Display',serif;
    color:#e62828;
    font-size:70px;
    line-height:1.1;
}

.divider{
    width:2px;
    height:120px;
    background:#e62828;
    margin:auto;
}

.live-text{
    color:#444;
    font-size:24px;
    line-height:1.8;
}

.watch{
    margin-top:30px;
    color:#f51923;
    font-size:22px;
}

/* UNLOCK SECTION */
.unlock{
    height:600px;
    background:
    linear-gradient(
    rgba(255,180,100,.4),
    rgba(255,180,100,.4)),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

.unlock h2{
    font-family:'Oswald',sans-serif;
    font-size:180px;
    color:#ff5722;
    letter-spacing:5px;
}

/* MOBILE */
@media(max-width:900px){

.hero{
    flex-direction:column;
}

.hero-left{
    width:100%;
    padding:60px 30px;
    border-radius:0;
}

.hero-left h1{
    font-size:70px;
}

.hero-left p{
    font-size:20px;
}

.hero-right{
    width:100%;
    height:350px;
}

.dancer-img{
    width:300px;
    top:20px;
    right:20px;
}

.live{
    grid-template-columns:1fr;
    gap:30px;
}

.divider{
    display:none;
}

.live-title{
    font-size:50px;
}

.unlock h2{
    font-size:70px;
}

}

</style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">Courses</a>
    <a href="#">Group Classes</a>
    <a href="#">More</a>
</nav>

<section class="hero">

    <div class="hero-left">

        <div class="the">The</div>

        <h1>
            FRENCH<br>
            UP!
        </h1>

        <p>Because Language is Power.</p>

    </div>

    <div class="hero-right">

        <img src="images/dancer_homepage.png" alt="French Up Dancer" class="dancer-img">

        <div class="stairs">

            <div class="step"></div>
            <div class="step"></div>
            <div class="step"></div>
            <div class="step"></div>

        </div>

    </div>

</section>

<section class="live">

    <div class="live-title">
        We're Going<br>
        Live
    </div>

    <div class="divider"></div>

    <div>

        <div class="live-text">
            Easy online access to lectures and live sessions.
            Fun and productive ways to enrich your knowledge
            and improve your French.
        </div>

        <div class="watch">
            Watch Now
        </div>

    </div>

</section>

<section class="unlock">

    <h2>UNLOCK</h2>

</section>

</body>
</html>
