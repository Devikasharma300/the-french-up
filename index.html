<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The French Up</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#efefef;
    font-family:'Poppins',sans-serif;
}

/* NAVIGATION */
nav{
    background:#f5f5f5;
    padding:25px 10%;
    display:flex;
    justify-content:flex-end;
    gap:50px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-size:15px;
}

/* HERO IMAGE (FULL WIDTH) */
.hero-image{
    width:100%;
    height:900px; /* adjust height if needed */
    background-image: url("images/dancer_homepage.png");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}

/* LIVE SECTION */
.live{
    background:#efefef;
    padding:120px 10%;
    display:grid;
    grid-template-columns:1fr 40px 1fr;
    align-items:center;
}

.live-title{
    font-family:'Playfair Display',serif;
    color:#e62828;
    font-size:70px;
    line-height:1.1;
}

.divider{
    width:2px;
    height:120px;
    background:#e62828;
    margin:auto;
}

.live-text{
    color:#444;
    font-size:24px;
    line-height:1.8;
}

.watch{
    margin-top:30px;
    color:#f51923;
    font-size:22px;
}

/* UNLOCK SECTION */
.unlock{
    height:600px;
    background:
    linear-gradient(
    rgba(255,180,100,.4),
    rgba(255,180,100,.4)),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

.unlock h2{
    font-family:'Oswald',sans-serif;
    font-size:180px;
    color:#ff5722;
    letter-spacing:5px;
}

/* MOBILE */
@media(max-width:900px){
    .hero-image{
        height:500px;
        background-size:cover;
        background-position:center;
    }
    .live{
        grid-template-columns:1fr;
        gap:30px;
    }
    .divider{
        display:none;
    }
    .live-title{
        font-size:50px;
    }
    .unlock h2{
        font-size:70px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">Courses</a>
    <a href="#">Group Classes</a>
    <a href="#">More</a>
</nav>

<!-- HERO SECTION AS FULL IMAGE -->
<section class="hero-image"></section>

<section class="live">

    <div class="live-title">
        We're Going<br>
        Live
    </div>

    <div class="divider"></div>

    <div>

        <div class="live-text">
            Easy online access to lectures and live sessions.
            Fun and productive ways to enrich your knowledge
            and improve your French.
        </div>

        <div class="watch">
            Watch Now
        </div>

    </div>

</section>

<section class="unlock">

    <h2>UNLOCK</h2>

</section>

</body>
</html>
