<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The French Up</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#efefef;
}

/* NAVIGATION */
nav{
    background:#f5f5f5;
    padding:25px 10%;
    display:flex;
    justify-content:flex-end;
    gap:50px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-size:15px;
}

/* HERO IMAGE FULLSCREEN */
.hero-image{
    width:100%;
    height:100vh;
    overflow:hidden;
    position:relative;
}

.hero-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
}

/* TYPEWRITER TEXT (UPDATED POSITION ONLY) */
#typewriter-container {
    position:absolute;
    top:74%; /* 🔥 pushed further down so it clears "UP" */
    left:10%;
    font-family:'Courier New', monospace;
    font-size:25px;
    color:white;
    text-align:left;
    white-space:nowrap;
}

#typewriter::after {
    content:'|';
    display:inline-block;
    margin-left:5px;
    animation: blink 0.7s infinite;
    color:white;
    width:2px;
}

@keyframes blink {
    0%,50%,100% { opacity:1; }
    25%,75% { opacity:0; }
}

/* LIVE SECTION */
.live{
    background:#efefef;
    padding:120px 10%;
    display:grid;
    grid-template-columns:1fr 40px 1fr;
    align-items:center;
}

.live-title{
    font-family:'Playfair Display',serif;
    color:#e62828;
    font-size:70px;
    line-height:1.1;
}

.divider{
    width:2px;
    height:120px;
    background:#e62828;
    margin:auto;
}

.live-text{
    color:#444;
    font-size:24px;
    line-height:1.8;
}

.watch{
    margin-top:30px;
    color:#f51923;
    font-size:22px;
}

/* UNLOCK SECTION */
.unlock{
    height:600px;
    background:
    linear-gradient(
    rgba(255,180,100,.4),
    rgba(255,180,100,.4)),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

.unlock h2{
    font-family:'Oswald',sans-serif;
    font-size:180px;
    color:#ff5722;
    letter-spacing:5px;
}

/* MOBILE */
@media(max-width:900px){
    .hero-image{
        height:70vh;
    }

    #typewriter-container{
        font-size:20px;
        top:70%; /* 🔥 adjusted for mobile too */
        left:8%;
    }

    .live{
        grid-template-columns:1fr;
        gap:30px;
    }

    .divider{
        display:none;
    }

    .live-title{
        font-size:50px;
    }

    .unlock h2{
        font-size:70px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">Courses</a>
    <a href="#">Group Classes</a>
    <a href="#">More</a>
</nav>

<!-- HERO IMAGE -->
<section class="hero-image">
    <img src="images/dancer_homepage.png" alt="French Up Homepage">

    <!-- TYPEWRITER ONLY -->
    <div id="typewriter-container">
        <span id="typewriter"></span>
    </div>
</section>

<!-- LIVE SECTION -->
<section class="live">

    <div class="live-title">
        We're Going<br>
        Live
    </div>

    <div class="divider"></div>

    <div>

        <div class="live-text">
            Easy online access to lectures and live sessions.
            Fun and productive ways to enrich your knowledge
            and improve your French.
        </div>

        <div class="watch">
            Watch Now
        </div>

    </div>

</section>

<!-- UNLOCK SECTION -->
<section class="unlock">

    <h2>UNLOCK</h2>

</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('typewriter');
    const text = "Because Language is Power.";
    const typingSpeed = 150;
    const initialDelay = 1000;
    const repeatDelay = 2000;

    function typeWriter(){
        let i = 0;

        function typing(){
            if(i < text.length){
                el.textContent += text.charAt(i);
                i++;
                setTimeout(typing, typingSpeed);
            } else {
                setTimeout(() => {
                    el.textContent = "";
                    i = 0;
                    setTimeout(typing, initialDelay);
                }, repeatDelay);
            }
        }

        setTimeout(typing, initialDelay);
    }

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if(entry.isIntersecting){
                typeWriter();
                observer.disconnect();
            }
        });
    }, { threshold: 0.1 });

    observer.observe(document.getElementById('typewriter-container'));
});
</script>

</body>
</html>
