           GLOBAL RESET
        =================================== */

        *,

            max-width: 100%;
        }

        a {
            color: inherit;
        }

        /* ===================================
           FIXED TOP HEADER

        .floating-header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 9999;

            display: flex;
            align-items: center;

            min-height: 52px;
            padding: 5px 18px;

            background-color: #ffffff;
        }

        /* ===================================
           LOGO
        =================================== */

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 120px;
            min-height: 42px;

            background-color: #cf1b1b;
            color: #ffffff;

            font-family:
                "Avenir Next",
                Avenir,
                Helvetica,
                Arial,
                sans-serif;

            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.3px;
            line-height: 1;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            white-space: nowrap;

            transition:
                background-color 0.3s ease,
                transform 0.3s ease;
        }

        .logo-box:hover,
        .logo-box:focus-visible {
            background-color: #b51616;
        }

        .logo-box:focus-visible {
            outline: 3px solid #222222;
            outline-offset: 3px;
        }

        /* ===================================
           NAVIGATION
        =================================== */

        .main-nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .main-nav a {
            position: relative;

            color: #222222;

            font-family:
                "Avenir Next",
                Avenir,
                Helvetica,
                Arial,
                sans-serif;

            font-size: 13px;
            font-weight: 400;
            text-decoration: none;

            transition: color 0.3s ease;
        }

        .main-nav a:hover,
        .main-nav a:focus-visible {
            color: #cf1b1b;

        .main-nav a:focus-visible {
            outline: 2px solid #cf1b1b;
            outline-offset: 4px;
        }

        /* ===================================
           HERO SECTION
        =================================== */

        .hero-image {
            position: relative;

            width: 100%;
            min-height: 100vh;
            padding-top: 52px;

            overflow: hidden;
            background-color: #ffffff;
        }

        .hero-image img {
            width: 100%;
            height: auto;
        }

        /* ===================================
           TYPEWRITER TEXT
        =================================== */

        #typewriter-container {
            position: absolute;
            top: 79%;
            left: 13%;

            color: #ffffff;

            font-family: "Courier New", Courier, monospace;
            font-size: 24px;
            line-height: 1.3;
            white-space: nowrap;
        }

        #typewriter::after {
            content: "|";

            margin-left: 4px;

            animation: cursor-blink 0.8s infinite;
        }

        @keyframes cursor-blink {
            0%,
            50%,
            100% {
                opacity: 1;
            }

            25%,
            75% {
                opacity: 0;
            }
        }

        /* ===================================
           SOCIAL MEDIA BAR
        =================================== */

        .social-bar {
            position: fixed;
            top: 50%;
            right: 18px;
            z-index: 9998;

            display: flex;
            flex-direction: column;
            gap: 10px;

            transform: translateY(-50%);
        }

        .social-bar a {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 32px;
            height: 32px;

            color: #8a8a8a;

            font-size: 18px;
            text-decoration: none;

            transition:
                color 0.3s ease,
                transform 0.3s ease;
        }

        .social-bar a:hover,

            color: #cf1b1b;

        .social-bar a:focus-visible {

        .contact-box {

            align-items: center;
            justify-content: center;

            min-height: 52px;
            padding: 10px 16px;

            background-color: #ef2020;
            color: #ffffff;

            line-height: 1.2;
            text-align: center;
            text-decoration: none;

            transition:
                background-color 0.3s ease,
                transform 0.3s ease;
        }

        .contact-box span {
            font-size: 22px;
            line-height: 1;
        }

        .contact-box:hover,
        .contact-box:focus-visible {
            background-color: #d71920;
            transform: translateY(-2px);
        }

        .contact-box:focus-visible {
            outline: 3px solid #222222;
            outline-offset: 3px;
        }

        /* ===================================
           WE BUILD TOGETHER SECTION
        =================================== */

        .wbt-section {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr);
            align-items: center;

            width: 100%;
            padding: 120px 10%;

            background-color: #ffffff;
        }

        /*
           Heading 2:
           Playfair Display Bold
           46px
           Semantic HTML tag: h2
        */

        .wbt-title {
            color: #ef2020;

            font-family: "Playfair Display", Georgia, serif;

            line-height: 1.12;
            letter-spacing: 0;
        }

        .wbt-divider {
            width: 2px;
            height: 120px;
            margin: auto;

            background-color: #ef2020;
        }

        .wbt-content {
            max-width: 620px;
        }

        /*
           Paragraph 2:
           Avenir Light
           16px
           Semantic HTML tag: p
        */

        .wbt-description {
            color: #444444;

            font-family:
                "Avenir Light",
                "Avenir Next",
                Avenir,

                Arial,

            font-family:
                "Avenir Next",
                Avenir,
                Helvetica,

                sans-serif;

            font-weight: 400;
            text-decoration: none;

            transition:
                color 0.3s ease,

        .wbt-link:focus-visible {
            color: #c61616;
            transform: translateX(4px);
        }

        .wbt-link:focus-visible {
            outline: 2px solid #ef2020;
            outline-offset: 4px;
        }

        /* ===================================
           VIDEO SECTION
        =================================== */

        .video-section {

            align-items: center;
            justify-content: center;

            padding: 35px;

        }

        .video-wrapper {
            width: 100%;

        }

            width: 100%;

            object-position: center 2%;

        /* ===================================
           TABLET AND MOBILE
        =================================== */

        @media (max-width: 900px) {
            .floating-header {
                position: relative;

                padding-top: 0;

            #typewriter-container {
                top: 82%;
                left: 8%;

                font-size: 16px;
            }

            .social-bar {
                right: 8px;
            }

            .social-bar a {
                font-size: 16px;
            }

            .contact-box {
                right: 14px;
                bottom: 14px;

                width: 150px;
                min-height: 46px;

                font-size: 16px;
            }

            .contact-box span {
                font-size: 20px;
            }

            .wbt-section {
                grid-template-columns: 1fr;

                padding: 64px 8%;
            }

            .wbt-divider {
                display: none;
            }

            .wbt-title {
                font-size: 46px;
            }

            .wbt-description {
                font-size: 16px;

            .wbt-link {
                margin-top: 22px;

            .video-section {

        /* ===================================
           SMALL MOBILE
        =================================== */

        @media (max-width: 560px) {
            .main-nav {

            .main-nav a {

            }

            }

                padding: 8px 12px;

            }

        }

        /* ===================================
           REDUCED MOTION ACCESSIBILITY
        =================================== */

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const typewriterElement =
                document.getElementById("typewriter");

            if (!typewriterElement) {
                return;
            }

            const text = "Because Language is Power.";
            const typingSpeed = 150;
            const initialDelay = 1000;
            const repeatDelay = 2000;

            let characterIndex = 0;
            let typingTimer;

            function typeText() {
                if (characterIndex < text.length) {
                    typewriterElement.textContent +=
                        text.charAt(characterIndex);

                    characterIndex += 1;

                    typingTimer = window.setTimeout(
                        typeText,
                        typingSpeed
                    );

                    return;
                }

                typingTimer = window.setTimeout(() => {
                    typewriterElement.textContent = "";
                    characterIndex = 0;

                    typingTimer = window.setTimeout(
                        typeText,
                        initialDelay
                    );
                }, repeatDelay);
            }

            const reducedMotionQuery = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            );

            if (reducedMotionQuery.matches) {
                typewriterElement.textContent = text;
                return;
            }

            typingTimer = window.setTimeout(
                typeText,
                initialDelay
            );

            window.addEventListener("beforeunload", () => {
                window.clearTimeout(typingTimer);
            });
        });
    </script>
