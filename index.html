<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The French Up</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#efefef;
    overflow-x:hidden;
}

/* ===================================
   HEADER
=================================== */

.floating-header{
    position:absolute;

    top:48px;
    left:22px;
    right:22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:9999;
}

/* LOGO */

.logo-box{

    width:132px;
    height:62px;

    background:#c94040;

    color:#fff;
    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'Bebas Neue',sans-serif;
    font-size:30px;
    letter-spacing:1px;

    text-transform:uppercase;
}

/* NAVIGATION */

.main-nav{

    height:62px;

    background:#f7f7f7;

    display:flex;
    align-items:center;

    padding:0 55px;

    gap:62px;
}

.main-nav a{

    text-decoration:none;

    color:#333;

    font-size:14px;
    font-weight:300;

    letter-spacing:1.5px;

    text-transform:uppercase;

    transition:.3s;
}

.main-nav a:hover{
    color:#c94040;
}

/* CONTACT */

.contact-box{

    width:150px;
    height:62px;

    background:#ef2020;

    color:#fff;
    text-decoration:none;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:14px;
    font-weight:500;
}

.contact-box:hover{
    background:#d81a1a;
}

/* ===================================
   HERO IMAGE
=================================== */

.hero-image{

    width:100%;
    height:100vh;

    overflow:hidden;
    position:relative;
}

.hero-image img{

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;
}

/* ===================================
   TYPEWRITER
=================================== */

#typewriter-container{

    position:absolute;

    left:13%;
    top:72%;

    font-family:'Courier New',monospace;
    font-size:24px;

    color:white;

    white-space:nowrap;
}

#typewriter::after{

    content:"|";

    margin-left:4px;

    animation:blink .8s infinite;
}

@keyframes blink{

    0%,50%,100%{
        opacity:1;
    }

    25%,75%{
        opacity:0;
    }
}

/* ===================================
   LIVE SECTION
=================================== */

.live{

    background:#efefef;

    padding:120px 10%;

    display:grid;

    grid-template-columns:1fr 40px 1fr;

    align-items:center;
}

.live-title{

    font-family:'Playfair Display',serif;

    color:#ef2020;

    font-size:70px;

    line-height:1.1;
}

.divider{

    width:2px;
    height:120px;

    background:#ef2020;

    margin:auto;
}

.live-text{

    color:#444;

    font-size:24px;

    line-height:1.8;
}

.watch{

    margin-top:30px;

    color:#ef2020;

    font-size:22px;
}

/* ===================================
   UNLOCK SECTION
=================================== */

.unlock{

    height:600px;

    background:
    linear-gradient(
        rgba(255,180,100,.4),
        rgba(255,180,100,.4)
    ),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

.unlock h2{

    font-family:'Bebas Neue',sans-serif;

    font-size:180px;

    letter-spacing:5px;

    color:#ff5722;
}

/* ===================================
   MOBILE
=================================== */

@media(max-width:900px){

    .floating-header{

        position:fixed;

        flex-direction:column;

        gap:10px;

        top:10px;
        left:10px;
        right:10px;
    }

    .logo-box,
    .contact-box{

        width:100%;
        max-width:300px;
    }

    .main-nav{

        width:100%;

        justify-content:center;

        flex-wrap:wrap;

        gap:18px;

        padding:15px;

        height:auto;
    }

    .hero-image{

        height:70vh;
    }

    #typewriter-container{

        font-size:18px;

        left:8%;
        top:68%;
    }

    .live{

        grid-template-columns:1fr;

        gap:30px;
    }

    .divider{

        display:none;
    }

    .live-title{

        font-size:50px;
    }

    .unlock h2{

        font-size:70px;
    }
}

</style>
</head>

<body>

<header class="floating-header">

    <a href="index.html" class="logo-box">
        FRENCH UP
    </a>

    <nav class="main-nav">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Group Classes</a>
        <a href="#">More</a>
    </nav>

    <a href="mailto:contact.frenchup@gmail.com" class="contact-box">
        Connect Now ✉
    </a>

</header>

<section class="hero-image">

    <img src="images/dancer_homepage.png"
         alt="French Up Homepage">

    <div id="typewriter-container">
        <span id="typewriter"></span>
    </div>

</section>

<section class="live">

    <div class="live-title">
        We're Going<br>
        Live
    </div>

    <div class="divider"></div>

    <div>

        <div class="live-text">
            Easy online access to lectures and live sessions.
            Fun and productive ways to enrich your knowledge
            and improve your French.
        </div>

        <div class="watch">
            Watch Now
        </div>

    </div>

</section>

<section class="unlock">

    <h2>UNLOCK</h2>

</section>

<script>

document.addEventListener('DOMContentLoaded',()=>{

    const el=document.getElementById('typewriter');

    const text="Because Language is Power.";

    const typingSpeed=150;
    const initialDelay=1000;
    const repeatDelay=2000;

    function typeWriter(){

        let i=0;

        function typing(){

            if(i<text.length){

                el.textContent+=text.charAt(i);

                i++;

                setTimeout(typing,typingSpeed);

            }else{

                setTimeout(()=>{

                    el.textContent='';

                    i=0;

                    setTimeout(typing,initialDelay);

                },repeatDelay);
            }
        }

        setTimeout(typing,initialDelay);
    }

    typeWriter();
});

</script>

</body>
</html>
