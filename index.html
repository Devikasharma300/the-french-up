<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The French Up</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#efefef;
    overflow-x:hidden;
}

/* ===================================
   HERO IMAGE ONLY
=================================== */

.hero{

    width:100%;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#efefef;
}

.hero img{

    width:100%;
    height:auto;

    display:block;
}

/* ===================================
   LIVE SECTION
=================================== */

.live{

    background:#efefef;

    padding:120px 10%;

    display:grid;

    grid-template-columns:1fr 40px 1fr;

    align-items:center;
}

.live-title{

    font-family:'Playfair Display',serif;

    color:#ef2020;

    font-size:70px;

    line-height:1.1;
}

.divider{

    width:2px;
    height:120px;

    background:#ef2020;

    margin:auto;
}

.live-text{

    color:#444;

    font-size:24px;

    line-height:1.8;
}

.watch{

    margin-top:30px;

    color:#ef2020;

    font-size:22px;

    font-weight:500;
}

/* ===================================
   UNLOCK SECTION
=================================== */

.unlock{

    height:600px;

    background:
    linear-gradient(
        rgba(255,180,100,.35),
        rgba(255,180,100,.35)
    ),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

.unlock h2{

    font-family:'Bebas Neue',sans-serif;

    font-size:180px;

    letter-spacing:6px;

    color:#ff5722;
}

/* ===================================
   MOBILE
=================================== */

@media(max-width:900px){

    .hero{
        min-height:auto;
    }

    .live{

        grid-template-columns:1fr;

        gap:30px;

        padding:80px 8%;
    }

    .divider{
        display:none;
    }

    .live-title{
        font-size:50px;
    }

    .live-text{
        font-size:20px;
    }

    .unlock h2{
        font-size:80px;
    }
}

</style>
</head>

<body>

<!-- HERO IMAGE -->

<section class="hero">

    <img src="images/dancer_homepage.png"
         alt="The French Up">

</section>

<!-- LIVE SECTION -->

<section class="live">

    <div class="live-title">
        We're Going<br>
        Live
    </div>

    <div class="divider"></div>

    <div>

        <div class="live-text">
            Easy online access to lectures and live sessions.
            Fun and productive ways to enrich your knowledge and improve your French.
        </div>

        <div class="watch">
            Watch Now
        </div>

    </div>

</section>

<!-- UNLOCK SECTION -->

<section class="unlock">

    <h2>UNLOCK</h2>

</section>

</body>
</html>
