<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The French Up</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#efefef;
    overflow-x:hidden;
}

/* ===================================
   FIXED TOP BAR
=================================== */

.floating-header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:52px;

    background:#ffffff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    z-index:9999;
}

/* ===================================
   LOGO
=================================== */

.logo-box{

    width:120px;
    height:42px;

    background:#cf1b1b;

    color:#ffffff;

    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
        "Avenir Next",
        Avenir,
        Helvetica,
        sans-serif;

    font-size:13px;

    font-weight:400;

    letter-spacing:.3px;

    text-transform:uppercase;

    white-space:nowrap;
}

/* ===================================
   NAVIGATION
=================================== */

.main-nav{

    display:flex;

    align-items:center;

    gap:32px;
}

.main-nav a{

    text-decoration:none;

    color:#222;

    font-family:
        "Avenir Next",
        Avenir,
        Helvetica,
        sans-serif;

    font-size:13px;

    font-weight:400;

    transition:.3s;
}

.main-nav a:hover{

    color:#cf1b1b;
}

/* ===================================
   HERO IMAGE
=================================== */

.hero-image{

    width:100%;

    min-height:100vh;

    padding-top:52px;

    background:#ffffff;

    position:relative;
}

.hero-image img{

    width:100%;

    display:block;

    height:auto;
}

/* ===================================
   TYPEWRITER
=================================== */

#typewriter-container{

    position:absolute;

    left:13%;
    top:79%;

    font-family:'Courier New',monospace;

    font-size:24px;

    color:white;

    white-space:nowrap;
}

#typewriter::after{

    content:"|";

    margin-left:4px;

    animation:blink .8s infinite;
}

@keyframes blink{

    0%,50%,100%{
        opacity:1;
    }

    25%,75%{
        opacity:0;
    }
}

/* ===================================
   SOCIAL BAR
=================================== */

.social-bar{

    position:fixed;

    right:18px;

    top:50%;

    transform:translateY(-50%);

    display:flex;
    flex-direction:column;

    gap:10px;

    z-index:9998;
}

.social-bar a{

    color:#8a8a8a;

    font-size:18px;

    text-decoration:none;

    transition:.3s;
}

.social-bar a:hover{

    color:#555;
}

/* ===================================
   CONNECT BUTTON
=================================== */

.contact-box{

    position:fixed;

    right:20px;
    bottom:20px;

    width:170px;
    height:52px;

    background:#ef2020;

    color:#ffffff;

    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    font-family:'Playfair Display',serif;

    font-size:18px;

    z-index:9999;
}

.contact-box span{

    font-size:22px;
}

.contact-box:hover{

    background:#d71920;
}

/* ===================================
   LIVE SECTION
=================================== */

.live{

    background:#efefef;

    padding:120px 10%;

    display:grid;

    grid-template-columns:1fr 40px 1fr;

    align-items:center;
}

.live-title{

    font-family:'Playfair Display',serif;

    color:#ef2020;

    font-size:70px;

    line-height:1.1;
}

.divider{

    width:2px;

    height:120px;

    background:#ef2020;

    margin:auto;
}

.live-text{

    color:#444;

    font-size:24px;

    line-height:1.8;
}

.watch{

    margin-top:30px;

    color:#ef2020;

    font-size:22px;
}

/* ===================================
   VIDEO SECTION
=================================== */

.video-section{

    width:100%;

    height:600px;

    background:#000000;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.video-section video{

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center 35%;

    display:block;
}

/* ===================================
   MOBILE
=================================== */

@media(max-width:900px){

    .floating-header{

        flex-direction:column;

        height:auto;

        padding:12px;

        gap:10px;
    }

    .main-nav{

        gap:16px;

        flex-wrap:wrap;

        justify-content:center;
    }

    .hero-image{

        padding-top:90px;
    }

    #typewriter-container{

        left:8%;
        top:72%;

        font-size:18px;
    }

    .social-bar{

        right:10px;
    }

    .social-bar a{

        font-size:16px;
    }

    .contact-box{

        width:150px;
        height:46px;

        font-size:16px;
    }

    .contact-box span{

        font-size:20px;
    }

    .live{

        grid-template-columns:1fr;

        gap:30px;
    }

    .divider{

        display:none;
    }

    .live-title{

        font-size:50px;
    }

    .live-text{

        font-size:20px;
    }

    .video-section{

        height:600px;
    }

    .video-section video{

        object-position:center 35%;
    }
}

</style>
</head>

<body>

<header class="floating-header">

    <a href="index.html" class="logo-box">
        THE FRENCH UP
    </a>

    <nav class="main-nav">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Group Classes</a>
        <a href="#">More</a>
    </nav>

</header>

<div class="social-bar">

    <a href="#"><i class="fab fa-facebook-f"></i></a>

    <a href="#"><i class="fab fa-instagram"></i></a>

    <a href="#"><i class="fab fa-youtube"></i></a>

    <a href="#"><i class="fab fa-linkedin-in"></i></a>

</div>

<a href="mailto:contact.frenchup@gmail.com"
class="contact-box">

    Connect Now
    <span>✉️</span>

</a>

<section class="hero-image">

    <img src="images/dancer_homepage.png"
         alt="French Up Homepage">

    <div id="typewriter-container">
        <span id="typewriter"></span>
    </div>

</section>

<section class="live">

    <div class="live-title">
        We're Going<br>
        Live
    </div>

    <div class="divider"></div>

    <div>

        <div class="live-text">
            Easy online access to lectures and live sessions.
            Fun and productive ways to enrich your knowledge
            and improve your French.
        </div>

        <div class="watch">
            Watch Now
        </div>

    </div>

</section>

<section class="video-section">

    <video
        src="video_learnrealfrench.mp4"
        title="video_learnrealfrench"
        controls
        playsinline>
        Your browser does not support the video tag.
    </video>

</section>

<script>

document.addEventListener('DOMContentLoaded',()=>{

    const el=document.getElementById('typewriter');

    const text="Because Language is Power.";

    const typingSpeed=150;
    const initialDelay=1000;
    const repeatDelay=2000;

    function typeWriter(){

        let i=0;

        function typing(){

            if(i<text.length){

                el.textContent+=text.charAt(i);

                i++;

                setTimeout(typing,typingSpeed);

            }else{

                setTimeout(()=>{

                    el.textContent='';

                    i=0;

                    setTimeout(typing,initialDelay);

                },repeatDelay);
            }
        }

        setTimeout(typing,initialDelay);
    }

    typeWriter();
});

</script>

</body>
</html>
